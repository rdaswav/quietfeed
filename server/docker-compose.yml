# Static server for the rule pack. Lives on the NAS under /volume1/docker/quietfeed.
services:
  quietfeed-rules:
    image: nginx:alpine
    container_name: quietfeed-rules
    restart: unless-stopped
    ports:
      - "8787:80"
    volumes:
      - /volume1/docker/quietfeed/rules:/usr/share/nginx/html:ro
      - /volume1/docker/quietfeed/nginx.conf:/etc/nginx/conf.d/default.conf:ro
