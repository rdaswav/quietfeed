# Serves only /rulepack.json. Everything else is 404 and there is no directory listing.
server {
    listen 80;
    server_name _;
    autoindex off;
    server_tokens off;

    location = /rulepack.json {
        root /usr/share/nginx/html;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        return 404;
    }
}
