name: QuietFeed
options:
  bundleIdPrefix: dev.quietfeed
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  QuietFeedCore:
    path: Packages/QuietFeedCore
targets:
  QuietFeed:
    type: application
    platform: iOS
    sources:
      - App
      - path: rules/rulepack.json
        buildPhase: resources
      - path: web/runtime.js
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Quiet Feed
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Quiet Feed checks your home server for updated hiding rules.
        NSCameraUsageDescription: Quiet Feed lets the sites you use take photos to post.
        NSMicrophoneUsageDescription: Quiet Feed lets the sites you use record audio and video to post.
        NSPhotoLibraryUsageDescription: Quiet Feed lets the sites you use attach photos from your library.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/QuietFeed.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.dev.quietfeed.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.quietfeed.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: QuietFeedCore
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: QuietFeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.quietfeed.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QuietFeed:
    build:
      targets:
        QuietFeed: all
    test:
      targets:
        - AppTests
