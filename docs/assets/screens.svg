<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Quiet Feed screens: Home with time left per site, the browser with a usage bar, and the calm limit reached screen">
  <style>
    :root { --canvas:#E9E7E0; --bg:#F6F5F1; --surface:#FFFFFF; --muted-surface:#EFEEE8; --line:#E3E1D9; --text:#1B1C19; --muted:#5A5C55; --accent:#4A6650; --accent-soft:#E4EBE3; --on-soft:#2F4A37; --warn:#8A5A12; --warn-soft:#F4E8D0; --on-accent:#FFFFFF; }
    @media (prefers-color-scheme: dark) {
      :root { --canvas:#0B0C0A; --bg:#121311; --surface:#1C1D1A; --muted-surface:#171815; --line:#2B2D28; --text:#ECEBE6; --muted:#A5A79E; --accent:#8FB096; --accent-soft:#1F2B24; --on-soft:#A9C9AF; --warn:#D9A65A; --warn-soft:#2D2416; --on-accent:#121311; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif; fill: var(--text); }
    .serif { font-family: "New York", "Newsreader", Georgia, serif; font-weight: 500; }
    .muted { fill: var(--muted); }
    .warn { fill: var(--warn); }
    .name { font-size: 17px; font-weight: 600; }
    .cap { font-size: 13px; fill: var(--muted); }
    .num { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .phone { fill: var(--bg); stroke: var(--line); stroke-width: 3; }
    .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
    .track { fill: var(--accent-soft); }
    .bar { fill: var(--accent); }
    .skel { fill: var(--line); }
  </style>
  <rect width="1200" height="760" rx="24" fill="var(--canvas)"/>

  <!-- Phone 1: Home -->
  <rect class="phone" x="40" y="40" width="320" height="640" rx="44"/>
  <g transform="translate(66 78) scale(.4375)">
    <rect width="64" height="64" rx="16" fill="var(--accent)"/>
    <rect x="16" y="19" width="26" height="4" rx="2" fill="var(--on-accent)" opacity=".4"/>
    <rect x="16" y="29" width="18" height="4" rx="2" fill="var(--on-accent)" opacity=".4"/>
    <rect x="16" y="43" width="32" height="5" rx="2.5" fill="var(--on-accent)"/>
  </g>
  <text class="serif" x="102" y="99" font-size="17">Quiet Feed</text>
  <text class="serif" x="66" y="156" font-size="26">Your feeds,</text>
  <text class="serif" x="66" y="186" font-size="26">with an end.</text>
  <text class="cap" x="66" y="210">Resets at 6:00 am</text>
  <rect class="card" x="60" y="230" width="280" height="92" rx="20"/>
  <text class="name" x="80" y="262">Instagram</text>
  <text class="num" x="320" y="262" text-anchor="end">22 min</text>
  <rect class="track" x="80" y="274" width="240" height="6" rx="3"/>
  <rect class="bar" x="80" y="274" width="176" height="6" rx="3"/>
  <text class="cap" x="80" y="302">left of 30</text>
  <rect class="card" x="60" y="334" width="280" height="92" rx="20"/>
  <text class="name" x="80" y="366">YouTube</text>
  <text class="num warn" x="320" y="366" text-anchor="end">6 min</text>
  <rect x="80" y="378" width="240" height="6" rx="3" fill="var(--warn-soft)"/>
  <rect x="80" y="378" width="216" height="6" rx="3" fill="var(--warn)"/>
  <text class="cap" x="80" y="406">left of 60</text>
  <rect x="60" y="438" width="280" height="78" rx="20" fill="var(--muted-surface)" stroke="var(--line)"/>
  <text class="name muted" x="80" y="470">Facebook</text>
  <text class="cap" x="320" y="470" text-anchor="end">Done for today</text>
  <rect x="80" y="482" width="240" height="6" rx="3" fill="var(--line)"/>
  <rect x="104" y="600" width="94" height="32" rx="10" fill="var(--accent-soft)"/>
  <text x="151" y="621" text-anchor="middle" font-size="12" font-weight="600" letter-spacing=".7" style="fill: var(--on-soft)">SHIELDED</text>
  <text class="cap" x="210" y="621">Official apps are blocked</text>

  <!-- Phone 2: Browser -->
  <rect class="phone" x="440" y="40" width="320" height="640" rx="44"/>
  <path d="M 440 126 H 760" stroke="var(--line)" stroke-width="1"/>
  <path d="M 478 90 l -8 8 l 8 8" fill="none" stroke="var(--text)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="name" x="494" y="104">Instagram</text>
  <rect x="598" y="82" width="104" height="32" rx="16" fill="var(--accent-soft)"/>
  <text x="650" y="103" text-anchor="middle" font-size="14" font-weight="600" style="fill: var(--on-soft)">12:40 left</text>
  <circle cx="484" cy="168" r="14" class="skel"/>
  <rect class="skel" x="508" y="156" width="110" height="10" rx="5"/>
  <rect class="skel" x="508" y="174" width="70" height="8" rx="4"/>
  <rect class="skel" x="462" y="198" width="276" height="190" rx="10"/>
  <rect class="skel" x="462" y="402" width="200" height="10" rx="5"/>
  <rect class="skel" x="462" y="422" width="140" height="8" rx="4"/>
  <circle cx="484" cy="476" r="14" class="skel"/>
  <rect class="skel" x="508" y="464" width="110" height="10" rx="5"/>
  <rect class="skel" x="462" y="506" width="276" height="90" rx="10"/>
  <rect x="490" y="212" width="220" height="38" rx="14" fill="var(--surface)" stroke="var(--line)"/>
  <text class="cap" x="600" y="236" text-anchor="middle" style="fill: var(--text)">3 things hidden</text>
  <path d="M 440 610 H 760" stroke="var(--line)" stroke-width="1"/>
  <text class="cap" x="462" y="634">Today’s Instagram</text>
  <text class="cap" x="738" y="634" text-anchor="end">17:20 of 30:00 used</text>
  <rect class="track" x="462" y="646" width="276" height="4" rx="2"/>
  <rect class="bar" x="462" y="646" width="160" height="4" rx="2"/>

  <!-- Phone 3: Limit reached -->
  <rect class="phone" x="840" y="40" width="320" height="640" rx="44"/>
  <g transform="translate(868 84) scale(.5)">
    <rect width="64" height="64" rx="16" fill="var(--accent)"/>
    <rect x="16" y="19" width="26" height="4" rx="2" fill="var(--on-accent)" opacity=".4"/>
    <rect x="16" y="29" width="18" height="4" rx="2" fill="var(--on-accent)" opacity=".4"/>
    <rect x="16" y="43" width="32" height="5" rx="2.5" fill="var(--on-accent)"/>
  </g>
  <text class="serif" x="868" y="372" font-size="38">That’s today’s</text>
  <text class="serif" x="868" y="414" font-size="38">Instagram.</text>
  <text class="cap" x="868" y="448" style="font-size:15px">You used 30 minutes. It’s back</text>
  <text class="cap" x="868" y="470" style="font-size:15px">tomorrow at 6:00 am.</text>
  <rect x="868" y="500" width="264" height="52" rx="14" fill="var(--accent)"/>
  <text x="1000" y="532" text-anchor="middle" font-size="17" font-weight="600" style="fill: var(--on-accent)">Done for today</text>
  <text x="1000" y="584" text-anchor="middle" font-size="15" font-weight="500" text-decoration="underline" style="fill: var(--accent)">Need more time?</text>

  <!-- Captions -->
  <text class="cap" x="200" y="724" text-anchor="middle" style="font-size:15px">Home: time left per site</text>
  <text class="cap" x="600" y="724" text-anchor="middle" style="font-size:15px">Browser: the feed, minus the pull</text>
  <text class="cap" x="1000" y="724" text-anchor="middle" style="font-size:15px">Limit reached: calm, not guilt</text>
</svg>
